name: Build CloneSpace APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CloneSpace-v0.1.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o CloneSpace-v0.1.zip
          echo "Extracted files:"
          find . -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: CloneSpace
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CloneSpace-debug-apk
          path: CloneSpace/app/build/outputs/apk/debug/app-debug.apk
